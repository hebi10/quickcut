name: Android build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install native build tools and test-video encoder
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends cmake nasm pkg-config ffmpeg
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.3.13750724"
      - name: Restore native build cache
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native-smartcut
            ~/.cargo/registry
            ~/.cargo/git
          key: native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-${{ hashFiles('native/**') }}
          restore-keys: |
            native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-
            native-smartcut-${{ runner.os }}-
      - name: Reset Rust outputs from a different native dependency cache
        env:
          NATIVE_CACHE_MATCHED_KEY: ${{ steps.native_cache.outputs.cache-matched-key }}
          NATIVE_CACHE_DEPENDENCY_PREFIX: native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-
        run: |
          # Legacy/cross-dependency caches may retain C builds, validated by .build-key.
          # Rebuild Rust from scratch so stale external static libraries cannot be linked.
          if [[ -n "$NATIVE_CACHE_MATCHED_KEY" && "$NATIVE_CACHE_MATCHED_KEY" != "$NATIVE_CACHE_DEPENDENCY_PREFIX"* ]]; then
            rm -rf build/native-smartcut/cargo-target
          fi
      - name: Build native smart-cut engine
        run: bash scripts/build-native-smartcut.sh --host-tests
      - name: Save native build cache
        if: success() && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/native-smartcut
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Validate emulator test script
        run: |
          bash -n scripts/android-emulator-check.sh scripts/android-instrumentation-check.sh scripts/verify-release-apk.sh scripts/build-native-smartcut.sh
          python3 scripts/test-emulator-failure.py
          python3 scripts/test-emulator-flow.py
      - name: Unit tests, lint, and builds
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Package corresponding source
        run: bash scripts/package-smartcut-source.sh
      - name: Upload corresponding source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-corresponding-source
          path: build/source-delivery/*
          if-no-files-found: error
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release for external signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

