name: Android build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Validate emulator test script
        run: bash -n scripts/android-emulator-check.sh scripts/verify-release-apk.sh
      - name: Unit tests, lint, and builds
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release for external signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

