name: Bootstrap official Gradle wrapper

on:
  push:
    paths:
      - ".github/workflows/bootstrap-wrapper.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Generate official wrapper and commit binary files
        run: |
          gradle wrapper --gradle-version 9.4.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "Gradle wrapper already tracked"
            exit 0
          fi
          git commit -m "build: commit official Gradle 9.4.1 wrapper"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
