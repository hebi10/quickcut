name: Android emulator smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/emulator-smoke.yml"

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch QuickCut on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.hebi.quickcut/.MainActivity
            sleep 3
            adb exec-out screencap -p > quickcut-start.png
            for i in 1 2 3; do
              adb shell uiautomator dump /sdcard/quickcut-ui.xml > /dev/null 2>&1 || true
              if adb shell cat /sdcard/quickcut-ui.xml 2>/dev/null | grep -q "영상 선택"; then
                echo "QuickCut start screen is visible"
                exit 0
              fi
              sleep 2
            done
            adb logcat -d -s AndroidRuntime:E | tail -100
            echo "Could not verify the QuickCut start screen"
            exit 1
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-emulator-start
          path: quickcut-start.png
          if-no-files-found: ignore
