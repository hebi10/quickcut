      - "scripts/ops08/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/play-closed-test.yml"
      - "scripts/publish-play-test.py"
      - "scripts/test-play-publisher.py"
