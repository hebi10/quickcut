concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Reclaim runner disk space for Android emulator
        run: |
          echo "Available disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo apt-get clean
          echo "Available disk after cleanup:"
          df -h /
      - name: Install native build tools and test-video encoder
        timeout-minutes: 25
        run: |
          set -euo pipefail
          missing=()
          command -v cmake >/dev/null 2>&1 || missing+=(cmake)
          command -v nasm >/dev/null 2>&1 || missing+=(nasm)
          command -v pkg-config >/dev/null 2>&1 || missing+=(pkg-config)
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            missing+=(ffmpeg)
          else
            encoders="$(ffmpeg -hide_banner -encoders)"
            if [[ "$encoders" != *libx264* || "$encoders" != *libx265* || "$encoders" != *libmp3lame* ]]; then
              missing+=(ffmpeg)
            fi
          fi
          if (( ${#missing[@]} == 0 )); then
            echo "Using preinstalled native tools and media encoders"
          else
            echo "Installing missing packages: ${missing[*]}"
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends "${missing[@]}"
          fi
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.3.13750724"
      - name: Restore native build cache
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native-smartcut
            ~/.cargo/registry
            ~/.cargo/git
          key: native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-${{ hashFiles('native/**') }}
          restore-keys: |
            native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-
            native-smartcut-${{ runner.os }}-
      - name: Reset Rust outputs from a different native dependency cache
        env:
          NATIVE_CACHE_MATCHED_KEY: ${{ steps.native_cache.outputs.cache-matched-key }}
          NATIVE_CACHE_DEPENDENCY_PREFIX: native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-
        run: |
          # Legacy/cross-dependency caches may retain C builds, validated by .build-key.
          # Rebuild Rust from scratch so stale external static libraries cannot be linked.
          if [[ -n "$NATIVE_CACHE_MATCHED_KEY" && "$NATIVE_CACHE_MATCHED_KEY" != "$NATIVE_CACHE_DEPENDENCY_PREFIX"* ]]; then
            rm -rf build/native-smartcut/cargo-target
          fi
      - name: Build native smart-cut engine
        run: bash scripts/build-native-smartcut.sh
      - name: Save native build cache
        if: success() && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/native-smartcut
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - name: Compile the debug APK before emulator boot
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          gradle --no-daemon :app:assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate bounded diagnostics and instrumentation control flow
        run: |
          bash -n scripts/android-emulator-check.sh scripts/android-instrumentation-check.sh scripts/android-dialog-geometry-check.sh
          python3 scripts/test-emulator-failure.py
          python3 scripts/test-emulator-startup.py
          python3 scripts/test-system-anr-watchdog.py
          python3 scripts/test-emulator-flow.py
          python3 scripts/test-dialog-geometry.py
      - name: Start bounded emulator host resource monitor
        continue-on-error: true
        run: |
          mkdir -p quickcut-host-diagnostics
          nohup python3 -u - "$RUNNER_TEMP/quickcut-host-monitor.json" > quickcut-host-diagnostics/host-resources.log 2>&1 <<'PY' &
          import datetime, json, os, signal, subprocess, sys, threading, time
          from pathlib import Path

          stop = threading.Event()
          signal.signal(signal.SIGTERM, lambda *_: stop.set())
          raw_stat = Path('/proc/self/stat').read_text()
          stat = raw_stat.rsplit(')', 1)[1].split()
          Path(sys.argv[1]).write_text(json.dumps({'pid': os.getpid(), 'proc_pid': int(raw_stat.split(' ', 1)[0]), 'start_ticks': stat[19]}))
          deadline = time.monotonic() + 3600
          for sample in range(180):
              if stop.is_set() or time.monotonic() >= deadline:
                  break
              print(datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
              for line in Path('/proc/meminfo').read_text().splitlines():
                  if line.split(':', 1)[0] in {'MemTotal', 'MemFree', 'MemAvailable', 'Buffers', 'Cached', 'SwapTotal', 'SwapFree'}:
                      print(line)
              for command in (['df', '-Pk', '/'], ['ps', '-eo', 'comm=,pid=,rss=,pcpu=']):
                  if stop.is_set() or time.monotonic() >= deadline:
                      break
                  try:
                      result = subprocess.run(command, capture_output=True, text=True, timeout=min(1, deadline - time.monotonic()))
                      lines = result.stdout.splitlines()
                      if command[0] == 'ps':
                          print('QEMU/emulator: comm pid rss_kib cpu_percent')
                          lines = [line for line in lines if line.split() and line.split()[0].startswith(('qemu', 'emulator'))][:20]
                      print('\n'.join(lines)[:4096])
                      print(command[0] + ' exit=' + str(result.returncode))
                  except subprocess.TimeoutExpired:
                      print(command[0] + ' timeout')
              sys.stdout.flush()
              if stop.wait(min(20, max(0, deadline - time.monotonic()))):
                  break
          print('Host monitor stopped.', flush=True)
          PY
      - name: Launch QuickCut on API ${{ matrix.api }} emulator
        env:
          QUICKCUT_EMULATOR_API: ${{ matrix.api }}
          QUICKCUT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: ${{ matrix.api == 29 && '4096M' || matrix.api == 35 && '3072M' || '2048M' }}
          heap-size: ${{ matrix.api == 29 && '384M' || '256M' }}
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -partition-size 2048
          disable-animations: true
          script: bash scripts/android-emulator-check.sh
      - name: Stop host monitor and collect bounded kernel failure events
        if: always()
        continue-on-error: true
        run: |
          mkdir -p quickcut-host-diagnostics
          python3 - <<'PY'
          import json, os, re, signal, subprocess, time
          from pathlib import Path

          state = Path(os.environ['RUNNER_TEMP']) / 'quickcut-host-monitor.json'
          if state.is_file():
              identity = json.loads(state.read_text())
              process_stat = Path('/proc') / str(identity['proc_pid']) / 'stat'
              def owned_monitor_running():
                  try:
                      stat = process_stat.read_text().rsplit(')', 1)[1].split()
                      return stat[0] != 'Z' and stat[19] == identity['start_ticks']
                  except FileNotFoundError:
                      return False
              if owned_monitor_running():
                  try:
                      os.kill(identity['pid'], signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  deadline = time.monotonic() + 1
                  while owned_monitor_running() and time.monotonic() < deadline:
                      time.sleep(0.05)
                  if owned_monitor_running():
                      try:
                          os.kill(identity['pid'], signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      print('Bounded stop terminated the owned host monitor.')
                  else:
                      print('Host monitor stopped cleanly.')
          else:
              print('Host monitor was not started.')
          try:
              result = subprocess.run(['sudo', '-n', 'dmesg', '--time-format', 'iso'], capture_output=True, text=True, timeout=1)
              relevant = re.compile(r'out of memory|oom[-_ ]|oom-kill|killed process|segfault|general protection fault', re.I)
              lines = [line for line in result.stdout.splitlines() if relevant.search(line)][-100:]
              report = 'kernel read exit=' + str(result.returncode) + '\n' + '\n'.join(lines)
          except (subprocess.TimeoutExpired, FileNotFoundError) as error:
              report = 'Kernel events unavailable: ' + type(error).__name__
          Path('quickcut-host-diagnostics/kernel-failure-events.log').write_text(report[:32768] + '\n')
          PY
      # The preceding emulator action shuts down its device. Start a fresh disposable
      # API 36 emulator here; the helper preserves/restores the full-suite workspace XML.
      - name: Verify real Dialog geometry on API 36
        if: success() && matrix.api == 36
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -partition-size 2048
          disable-animations: true
          script: bash scripts/android-dialog-geometry-check.sh
      - name: Upload real Dialog geometry evidence
        if: always() && matrix.api == 36
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-real-dialog-results-api-36
          path: quickcut-real-dialog-results/
          if-no-files-found: warn
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-emulator-start-api-${{ matrix.api }}
          path: |
            quickcut-start.png
            quickcut-startup-diagnostics/
            quickcut-tablet-start.png
            quickcut-fast-review.png
            quickcut-design-review/
          if-no-files-found: ignore
      - name: Upload Stage 20 verified screen and test manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-stage20-evidence-api-${{ matrix.api }}
          path: quickcut-stage20-evidence/verified-screens-and-tests.json
          if-no-files-found: warn
      - name: Upload synthetic MP4 audio verification fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-stage20-audio-api-${{ matrix.api }}
          path: quickcut-stage20-media/
          if-no-files-found: warn
      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-instrumentation-results-api-${{ matrix.api }}
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
      - name: Upload native preflight results separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-native-preflight-results-api-${{ matrix.api }}
          path: quickcut-native-preflight-results/
          if-no-files-found: ignore
      - name: Upload native failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-native-diagnostics-api-${{ matrix.api }}
          path: quickcut-native-diagnostics/
          if-no-files-found: ignore
      - name: Upload Android Main10 decoding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-android-main10-api-${{ matrix.api }}
          path: |
            quickcut-main10-preflight/
            quickcut-main10-full/
          if-no-files-found: ignore
      - name: Upload emulator host resource evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-host-diagnostics-api-${{ matrix.api }}
          path: quickcut-host-diagnostics/
          if-no-files-found: warn



