name: Android emulator smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/emulator-smoke.yml"
      - "scripts/android-emulator-check.sh"
      - "app/src/androidTest/**"
      - "app/src/main/java/com/hebi/quickcut/media/**"
      - "app/src/main/java/com/hebi/quickcut/editor/**"

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Reclaim runner disk space for Android emulator
        run: |
          echo "Available disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo apt-get clean
          echo "Available disk after cleanup:"
          df -h /
      - name: Install test-video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch QuickCut on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 1536M
          heap-size: 256M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -partition-size 2048
          disable-animations: true
          script: bash scripts/android-emulator-check.sh
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-emulator-start
          path: quickcut-start.png
          if-no-files-found: ignore
      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-instrumentation-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
