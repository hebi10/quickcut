name: Android emulator smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/emulator-smoke.yml"
      - "scripts/android-emulator-check.sh"
      - "scripts/test-emulator-failure.py"
      - "scripts/test-emulator-flow.py"
      - "scripts/android-instrumentation-check.sh"
      - "scripts/verify-android-main10.py"
      - "scripts/build-native-smartcut.sh"
      - "scripts/native-smartcut-sources.json"
      - "native/**"
      - "app/src/androidTest/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/com/hebi/quickcut/QuickCutApplication.kt"
      - "app/src/main/java/com/hebi/quickcut/export/**"
      - "app/build.gradle.kts"
      - "app/src/main/java/com/hebi/quickcut/media/**"
      - "app/src/main/java/com/hebi/quickcut/editor/**"
      - "app/src/main/java/com/hebi/quickcut/ui/**"
      - "app/src/main/java/com/hebi/quickcut/batch/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/emulator-smoke.yml"
      - "scripts/android-emulator-check.sh"
      - "scripts/test-emulator-failure.py"
      - "scripts/test-emulator-flow.py"
      - "scripts/android-instrumentation-check.sh"
      - "scripts/verify-android-main10.py"
      - "scripts/build-native-smartcut.sh"
      - "scripts/native-smartcut-sources.json"
      - "native/**"
      - "app/src/androidTest/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/com/hebi/quickcut/QuickCutApplication.kt"
      - "app/src/main/java/com/hebi/quickcut/export/**"
      - "app/build.gradle.kts"
      - "app/src/main/java/com/hebi/quickcut/media/**"
      - "app/src/main/java/com/hebi/quickcut/editor/**"
      - "app/src/main/java/com/hebi/quickcut/ui/**"
      - "app/src/main/java/com/hebi/quickcut/batch/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Reclaim runner disk space for Android emulator
        run: |
          echo "Available disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo apt-get clean
          echo "Available disk after cleanup:"
          df -h /
      - name: Install native build tools and test-video encoder
        timeout-minutes: 10
        run: |
          # A slow streaming Azure mirror can exceed the step limit without an APT timeout.
          # Keep the runner's existing signed Ubuntu sources and official HTTPS fallbacks.
          if [[ -f /etc/apt/apt-mirrors.txt ]] && grep -q '^https://archive\.ubuntu\.com/ubuntu/' /etc/apt/apt-mirrors.txt; then
            sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]*priority:1$|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends cmake nasm pkg-config ffmpeg
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.3.13750724"
      - name: Restore native build cache
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native-smartcut
            ~/.cargo/registry
            ~/.cargo/git
          key: native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-${{ hashFiles('native/**') }}
          restore-keys: |
            native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-
            native-smartcut-${{ runner.os }}-
      - name: Reset Rust outputs from a different native dependency cache
        env:
          NATIVE_CACHE_MATCHED_KEY: ${{ steps.native_cache.outputs.cache-matched-key }}
          NATIVE_CACHE_DEPENDENCY_PREFIX: native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-
        run: |
          # Legacy/cross-dependency caches may retain C builds, validated by .build-key.
          # Rebuild Rust from scratch so stale external static libraries cannot be linked.
          if [[ -n "$NATIVE_CACHE_MATCHED_KEY" && "$NATIVE_CACHE_MATCHED_KEY" != "$NATIVE_CACHE_DEPENDENCY_PREFIX"* ]]; then
            rm -rf build/native-smartcut/cargo-target
          fi
      - name: Build native smart-cut engine
        run: bash scripts/build-native-smartcut.sh
      - name: Save native build cache
        if: success() && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/native-smartcut
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate bounded diagnostics and instrumentation control flow
        run: |
          bash -n scripts/android-emulator-check.sh scripts/android-instrumentation-check.sh
          python3 scripts/test-emulator-failure.py
          python3 scripts/test-emulator-flow.py
      - name: Launch QuickCut on API ${{ matrix.api }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 1536M
          heap-size: 256M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -partition-size 2048
          disable-animations: true
          script: bash scripts/android-emulator-check.sh
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-emulator-start-api-${{ matrix.api }}
          path: |
            quickcut-start.png
            quickcut-tablet-start.png
            quickcut-fast-review.png
          if-no-files-found: ignore
      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-instrumentation-results-api-${{ matrix.api }}
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
      - name: Upload native preflight results separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-native-preflight-results-api-${{ matrix.api }}
          path: quickcut-native-preflight-results/
          if-no-files-found: ignore
      - name: Upload native failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-native-diagnostics-api-${{ matrix.api }}
          path: quickcut-native-diagnostics/
          if-no-files-found: ignore
      - name: Upload Android Main10 decoding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-android-main10-api-${{ matrix.api }}
          path: |
            quickcut-main10-preflight/
            quickcut-main10-full/
          if-no-files-found: ignore


