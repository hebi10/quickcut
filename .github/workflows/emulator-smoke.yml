    paths:
      - ".github/workflows/play-listing-images.yml"
      - "scripts/publish-play-listing-images.py"
      - "scripts/test-play-listing-images.py"
      - "store/google-play/**"
      - ".github/workflows/emulator-smoke.yml"
      - ".github/workflows/ops07-safety.yml"
      - ".github/workflows/ops08-final-policy.yml"
      - "scripts/ops07/**"
      - "scripts/ops08/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/play-closed-test.yml"
      - "scripts/publish-play-test.py"
      - "scripts/test-play-publisher.py"
      - "scripts/verify-play-bundle.py"
      - "scripts/VerifyBundleSignatures.java"
      - "scripts/test-play-bundle.py"
      - "config/release-certificate.sha256"
      - "docs/21_PLAY_TEST_AUTOMATION.md"
      - "scripts/verify-release-gate.py"
      - "scripts/require-app-release-change.py"
      - "scripts/test-app-release-change.py"
      - "scripts/test-release-gate.py"
      - "scripts/runtime-publication-metadata.py"
      - "scripts/test-runtime-publication-metadata.py"
      - "scripts/package-smartcut-source.sh"
      - "third_party/runtime-publication-metadata/**"
      - "scripts/android-emulator-check.sh"
      - "scripts/android-startup-check.py"
      - "scripts/test-emulator-startup.py"
      - "scripts/test-emulator-failure.py"
      - "scripts/test-emulator-flow.py"
      - "scripts/android-instrumentation-check.sh"
      - "scripts/android-dialog-geometry-check.sh"
      - "scripts/test-dialog-geometry.py"
      - "scripts/verify-android-main10.py"
      - "scripts/build-native-smartcut.sh"
      - "scripts/native-smartcut-sources.json"
