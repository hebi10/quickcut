name: QuickCut Play listing images

on:
  pull_request:
    paths:
      - "store/google-play/**"
      - "scripts/publish-play-listing-images.py"
      - "scripts/test-play-listing-images.py"
      - ".github/workflows/play-listing-images.yml"
  workflow_dispatch:
    inputs:
      ops06_store_approved:
        description: 'All planned work/QA complete; separate Play listing approval'
        type: boolean
        required: true
        default: false
      ops06_confirmation:
        description: 'For Apply: type APPLY_VERIFIED_PLAY_STORE_ASSETS'
        type: string
        required: false
      ops06_expected_main_sha:
        description: 'Exact reviewed current main commit SHA'
        type: string
        required: false
      ops06_batch_id:
        description: 'Approved KST release batch YYYY-MM-DD-quickcut'
        type: string
        required: false
      apply:
        description: Upload the approved icon, feature graphic and eight Korean phone screenshots
        required: true
        type: boolean
        default: false
concurrency:
  group: quickcut-play-test-edit
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact assets and PNG dimensions
        run: python3 scripts/publish-play-listing-images.py --check-only
      - name: Exercise safe publisher decisions without network calls
        run: python3 scripts/test-play-listing-images.py

  publish:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'hebi10/quickcut' && github.ref == 'refs/heads/main' &&
      inputs.apply == true && inputs.ops06_store_approved == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require latest exact-main Android and emulator CI to both pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-release-gate.py --mode play
          if ! grep -qx 'ready=true' "$GITHUB_OUTPUT"; then
            echo "::error::Exact main HEAD is not fully verified; Play images were not edited."
            exit 1
          fi
      - name: OPS-06 require approved KST batch, source and store-only request
        env:
          GH_TOKEN: ${{ github.token }}
          OPS06_STORE_APPROVED: ${{ inputs.ops06_store_approved }}
          OPS06_CONFIRMATION: ${{ inputs.ops06_confirmation }}
          OPS06_EXPECTED_MAIN_SHA: ${{ inputs.ops06_expected_main_sha }}
          OPS06_BATCH_ID: ${{ inputs.ops06_batch_id }}
        run: python3 scripts/ops06/store_gate.py apply
      - name: Choose existing Google Play credentials
        id: preflight
        env:
          PLAY_IDENTITY_PROVIDER: ${{ vars.QUICKCUT_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.QUICKCUT_PLAY_SERVICE_ACCOUNT }}
          PLAY_CREDENTIALS_JSON: ${{ secrets.QUICKCUT_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "$PLAY_IDENTITY_PROVIDER" && -n "$PLAY_SERVICE_ACCOUNT" ]]; then
            echo 'auth_mode=wif' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PLAY_CREDENTIALS_JSON" ]]; then
            echo 'auth_mode=json' >> "$GITHUB_OUTPUT"
          else
            echo '::error::No existing authorized Google Play credentials for listing images.'
            exit 1
          fi
      - name: Authenticate Play with Workload Identity Federation
        if: steps.preflight.outputs.auth_mode == 'wif'
        id: auth_wif
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.QUICKCUT_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.QUICKCUT_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Authenticate Play with existing service account JSON
        if: steps.preflight.outputs.auth_mode == 'json'
        id: auth_json
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.QUICKCUT_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Apply the existing ko-KR listing images in one non-retrying edit
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth_wif.outputs.access_token || steps.auth_json.outputs.access_token }}
        run: python3 scripts/publish-play-listing-images.py --publish
