name: QuickCut API35 preview diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/preview-api35-diagnostic.yml"
      - "scripts/diagnose-api35-preview.sh"
      - "app/src/main/**"
      - "app/src/androidTest/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.4.1"
      - name: Reclaim runner disk space for the diagnostic emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo apt-get clean
      - name: Install native build tools and fixture encoder
        timeout-minutes: 10
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]] && grep -q '^https://archive\.ubuntu\.com/ubuntu/' /etc/apt/apt-mirrors.txt; then
            sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]*priority:1$|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends cmake nasm pkg-config ffmpeg
      - name: Install the existing Android SDK and NDK versions
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
      - name: Restore exact native dependency cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/native-smartcut
            ~/.cargo/registry
            ~/.cargo/git
          key: native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-${{ hashFiles('native/**') }}
      - name: Build the unchanged native engine with existing validation
        run: bash scripts/build-native-smartcut.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate the diagnostic script
        run: bash -n scripts/diagnose-api35-preview.sh
      - name: Compare original-pattern and solid-blue preview output on API35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 1536M
          heap-size: 256M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -feature -HardwareDecoder -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -partition-size 2048
          disable-animations: true
          script: bash scripts/diagnose-api35-preview.sh
      - name: Retain both diagnostic profiles and original test outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickcut-api35-preview-diagnostic-${{ github.run_id }}
          path: quickcut-preview-diagnostic-results/
          if-no-files-found: warn
