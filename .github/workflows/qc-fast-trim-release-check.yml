name: QuickCut fast trim release preflight

on:
  pull_request:
    paths:
      - ".github/workflows/qc-fast-trim-release-check.yml"

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Fast trim and gallery recovery (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Reuse the verified native engine from the successful build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: "45151375622"
          SOURCE_SHA: 11815bcb1e949544563a1bed5fb485d8bd6b2ac7
        run: |
          set -euo pipefail
          git diff --exit-code "$SOURCE_SHA" HEAD -- native scripts/build-native-smartcut.sh scripts/native-smartcut-sources.json
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion |
            jq -e --arg sha "$SOURCE_SHA" '.headSha == $sha and .conclusion == "success"'
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name quickcut-debug-apk --dir "$RUNNER_TEMP/source-apk"
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(Path(os.environ["RUNNER_TEMP"]) / "source-apk/app-debug.apk") as apk:
              for abi in ("arm64-v8a", "x86_64"):
                  library = f"{abi}/libquickcut_smartcut.so"
                  target = Path("app/build/generated/nativeLibs") / library
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(apk.read("lib/" + library))
              notices = Path("build/generated/smartcutAssets/licenses/NATIVE-DEPENDENCIES.txt")
              notices.parent.mkdir(parents=True, exist_ok=True)
              notices.write_bytes(apk.read("assets/licenses/NATIVE-DEPENDENCIES.txt"))
          PYCODE
      - name: Prepare the pinned dated-video test assets
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sha256sum --check .github/workflows/qc-dated-assets.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check original dates in direct and native exports
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 3072M
          heap-size: 256M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -partition-size 2048
          disable-animations: true
          script: bash scripts/qc-preflight-dated-test.sh
      - name: Keep instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-fast-trim-api-${{ matrix.api }}
          path: dated-instrumentation.txt
          if-no-files-found: warn
