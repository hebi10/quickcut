name: QuickCut fast trim release preflight

on:
  pull_request:
    paths:
      - ".github/workflows/qc-fast-trim-release-check.yml"

permissions:
  contents: read

jobs:
  preflight:
    name: Fast trim and gallery recovery (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Install missing native build and fixture tools
        run: |
          set -euo pipefail
          missing=()
          for tool in cmake nasm pkg-config ffmpeg; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if (( ${#missing[@]} > 0 )); then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends "${missing[@]}"
          fi
      - name: Install Android SDK and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
      - name: Restore the pinned native build
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native-smartcut
            ~/.cargo/registry
            ~/.cargo/git
          key: native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-${{ hashFiles('native/**') }}
      - name: Build the native engine from pinned sources
        run: bash scripts/build-native-smartcut.sh
      - name: Prepare the existing full-suite video fixtures
        run: |
          set -euo pipefail
          awk '/^mkdir -p app\/src\/androidTest\/assets$/ {emit=1}
               /^# CI hardware keyboard/ {exit}
               emit' scripts/android-emulator-check.sh > "$RUNNER_TEMP/quickcut-fixtures.sh"
          bash -euo pipefail "$RUNNER_TEMP/quickcut-fixtures.sh"
          test -s app/src/androidTest/assets/quickcut_vfr_closed_gop.mp4
          test -s app/src/androidTest/assets/quickcut_bframes.mp4
          test -s app/src/androidTest/assets/quickcut_open_gop.mp4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cover B-frame and VFR copy, pending publication, dates and recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 3072M
          heap-size: 256M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -partition-size 2048
          disable-animations: true
          script: >-
            gradle --no-daemon :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.hebi.quickcut.media.FastBFrameInstrumentedTest,com.hebi.quickcut.media.FastCutExportInstrumentedTest,com.hebi.quickcut.media.NativeSmartCutInstrumentedTest#originalDateDoesNotForceFullVideoEncoding,com.hebi.quickcut.media.NativeSmartCutInstrumentedTest#originalDateCopyRemainsAvailableInFastOnlyMode,com.hebi.quickcut.media.PendingCleanupInstrumentedTest,com.hebi.quickcut.batch.BatchSessionStoreInstrumentedTest
      - name: Keep instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-fast-trim-api-${{ matrix.api }}
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
