name: Signed release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Build with persistent release identity
        env:
          QUICKCUT_KEYSTORE_BASE64: ${{ secrets.QUICKCUT_KEYSTORE_BASE64 }}
          QUICKCUT_KEYSTORE_PASSWORD: ${{ secrets.QUICKCUT_KEYSTORE_PASSWORD }}
          QUICKCUT_KEY_ALIAS: ${{ secrets.QUICKCUT_KEY_ALIAS }}
          QUICKCUT_KEY_PASSWORD: ${{ secrets.QUICKCUT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in QUICKCUT_KEYSTORE_BASE64 QUICKCUT_KEYSTORE_PASSWORD QUICKCUT_KEY_ALIAS QUICKCUT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release signing secret: $name. No replacement key will be generated."
              exit 1
            fi
          done
          umask 077
          export QUICKCUT_KEYSTORE_PATH="$RUNNER_TEMP/quickcut-release.p12"
          trap 'rm -f "$QUICKCUT_KEYSTORE_PATH"' EXIT
          printf '%s' "$QUICKCUT_KEYSTORE_BASE64" | base64 --decode > "$QUICKCUT_KEYSTORE_PATH"
          gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
          bash scripts/verify-release-apk.sh app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
