name: Signed release APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Android build, Android emulator smoke]
    branches: [main]
    types: [completed]

# Serialize both completion events and manual retries. Never cancel signing or
# publication in progress; the second event observes the existing version tag.
concurrency:
  group: quickcut-publish-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.gate.outputs.sha }}
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      version_code: ${{ steps.gate.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Test release authorization
        run: python3 scripts/test-release-gate.py
      - name: Require both workflows on the exact current main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release-gate.py

  release:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_VERSION_CODE: ${{ needs.gate.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Select configured signing or offline preparation
        id: signing
        env:
          QUICKCUT_KEYSTORE_BASE64: ${{ secrets.QUICKCUT_KEYSTORE_BASE64 }}
          QUICKCUT_KEYSTORE_PASSWORD: ${{ secrets.QUICKCUT_KEYSTORE_PASSWORD }}
          QUICKCUT_KEY_ALIAS: ${{ secrets.QUICKCUT_KEY_ALIAS }}
          QUICKCUT_KEY_PASSWORD: ${{ secrets.QUICKCUT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for name in QUICKCUT_KEYSTORE_BASE64 QUICKCUT_KEYSTORE_PASSWORD QUICKCUT_KEY_ALIAS QUICKCUT_KEY_PASSWORD; do
            if [[ -n "${!name}" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" -eq 4 ]]; then
            echo 'mode=signed' >> "$GITHUB_OUTPUT"
          elif [[ "$configured" -eq 0 ]]; then
            echo 'mode=offline' >> "$GITHUB_OUTPUT"
            echo 'Signing credentials are absent: preparing unsigned APK and tools for offline signing. No release will be published.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Partial signing configuration. Configure all four credentials or leave all four absent for offline preparation.'
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
      - name: Install native build tools
        timeout-minutes: 10
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]] && grep -q '^https://archive\.ubuntu\.com/ubuntu/' /etc/apt/apt-mirrors.txt; then
            sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]*priority:1$|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends cmake nasm pkg-config
      # Only restore the exact dependency/source key available to main. Never
      # use fallback keys or download artifacts from the triggering run.
      - name: Restore exact native dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native-smartcut
            ~/.cargo/registry
            ~/.cargo/git
          key: native-smartcut-${{ runner.os }}-${{ hashFiles('scripts/build-native-smartcut.sh', 'scripts/native-smartcut-sources.json') }}-${{ hashFiles('native/**') }}
      # The builder validates cached source archives and rebuilds as required.
      - name: Build native smart-cut engine from release source
        run: bash scripts/build-native-smartcut.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
          cache-disabled: true
      - name: Build release for configured signing mode
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          QUICKCUT_KEYSTORE_BASE64: ${{ secrets.QUICKCUT_KEYSTORE_BASE64 }}
          QUICKCUT_KEYSTORE_PASSWORD: ${{ secrets.QUICKCUT_KEYSTORE_PASSWORD }}
          QUICKCUT_KEY_ALIAS: ${{ secrets.QUICKCUT_KEY_ALIAS }}
          QUICKCUT_KEY_PASSWORD: ${{ secrets.QUICKCUT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING_MODE" == signed ]]; then
            umask 077
            export QUICKCUT_KEYSTORE_PATH="$RUNNER_TEMP/quickcut-release.p12"
            trap 'rm -f "$QUICKCUT_KEYSTORE_PATH"' EXIT
            printf '%s' "$QUICKCUT_KEYSTORE_BASE64" | base64 --decode > "$QUICKCUT_KEYSTORE_PATH"
          fi
          gradle --no-daemon -PquickcutTestVersionCode="$RELEASE_VERSION_CODE" :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          if [[ "$SIGNING_MODE" == signed ]]; then
            apk=app/build/outputs/apk/release/app-release.apk
            bash scripts/verify-release-apk.sh "$apk"
          else
            apk=app/build/outputs/apk/release/app-release-unsigned.apk
            test -s "$apk"
          fi
          # Both outputs must retain the version declared in this source.
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionCode='$RELEASE_VERSION_CODE'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='$RELEASE_VERSION'" "$RUNNER_TEMP/apk-badging.txt"
      - name: Package corresponding source
        run: bash scripts/package-smartcut-source.sh
      - name: Assemble release assets and checksums
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          test -s "docs/releases/$RELEASE_VERSION.md"
          mkdir -p build/release-delivery
          if [[ "$SIGNING_MODE" == signed ]]; then
            cp app/build/outputs/apk/release/app-release.apk "build/release-delivery/QuickCut-$RELEASE_TAG-release.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "build/release-delivery/QuickCut-$RELEASE_TAG-unsigned.apk"
            tooling="$RUNNER_TEMP/quickcut-signing-tools"
            mkdir -p "$tooling"
            cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$tooling/apksigner.jar"
            cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" "$tooling/zipalign"
            cp -a "$ANDROID_HOME/build-tools/36.0.0/lib64" "$tooling/lib64"
            export QUICKCUT_SIGNING_TOOLS="$tooling"
            python3 - <<'PYTOOLS'
          import os
          from pathlib import Path
          import zipfile
          root = Path(os.environ['QUICKCUT_SIGNING_TOOLS'])
          destination = Path('build/release-delivery') / ('QuickCut-' + os.environ['RELEASE_TAG'] + '-tooling.zip')
          with zipfile.ZipFile(destination, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          PYTOOLS
          fi
          cp "build/source-delivery/quickcut-corresponding-source-${RELEASE_SHA:0:12}.tar.gz" "build/release-delivery/QuickCut-$RELEASE_TAG-source.tar.gz"
          {
            printf '# QuickCut %s corresponding source\n\nCommit: `%s`\n\n' "$RELEASE_TAG" "$RELEASE_SHA"
            printf 'CI preparation: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [[ "$SIGNING_MODE" == offline ]]; then
              printf 'Status: awaiting offline signing. The unsigned APK is not installable. No tag or release was created by this preparation.\n\n'
              printf 'Before publication, align and sign with the existing QuickCut key, verify the pinned certificate using scripts/verify-release-apk.sh, verify versionName/versionCode, and regenerate SHA256SUMS for the final signed delivery.\n\n'
            fi
            cat docs/20_NATIVE_SMART_CUT.md
            printf '\n\n## Source identity\n\n```json\n'
            cat build/source-delivery/source-identity.json
            printf '\n```\n\n'
            cat build/source-delivery/UPSTREAM-SOURCE-LOCATIONS.md
          } > "build/release-delivery/QuickCut-$RELEASE_TAG-source-guide.md"
          (
            cd build/release-delivery
            files=( *.apk *.tar.gz *.md )
            if [[ "$SIGNING_MODE" == offline ]]; then files+=( *.zip ); fi
            sha256sum -- "${files[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Retain release delivery or unsigned offline preparation
        uses: actions/upload-artifact@v4
        with:
          name: quickcut-release-${{ needs.gate.outputs.tag }}
          path: build/release-delivery/*
          if-no-files-found: error
      - name: Report offline signing handoff
        if: steps.signing.outputs.mode == 'offline'
        run: |
          printf '## Awaiting offline signing\n\nUnsigned APK, matching source, checksums, and SDK tooling are in artifact `quickcut-release-%s`. This run has not published a release. Verify the existing pinned certificate after local signing.\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Recheck CI, current main, and absent version immediately before publishing
        if: steps.signing.outputs.mode == 'signed'
        id: final_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release-gate.py
      - name: Publish immutable signed APK and corresponding source
        if: steps.signing.outputs.mode == 'signed' && steps.final_gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Creating the ref first fails if another actor won the tag race.
          # The release can therefore never adopt an existing, different tag.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA"
          gh release create "$RELEASE_TAG" build/release-delivery/* \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --verify-tag \
            --title "QuickCut $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
